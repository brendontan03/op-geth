name: X Layer Op-Geth Scheduled CI

# Schedule: Daily at 2:00 PM Beijing Time (UTC+8)
on:
  workflow_dispatch:      # Allow manual trigger

# Ensure only one workflow runs at a time
concurrency:
  group: scheduler-xlayer-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read-only
permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  GOPRIVATE: "github.com/ethereum-optimism"
  TEST_TIMEOUT: "30m"

jobs:
  ##############################################################################
  # Phase 0: Sync from Upstream
  ##############################################################################

  sync-upstream:
    name: Sync from upstream (okx/op-geth)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Required for pushing merged changes
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/okx/op-geth.git || true
          git remote -v
      - name: Fetch upstream
        run: |
          echo "Fetching from upstream okx/op-geth..."
          git fetch upstream brendon/fix-linting
      - name: Merge upstream/brendon/fix-linting into current branch
        id: merge
        continue-on-error: true
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Attempting to merge upstream/brendon/fix-linting..."
          if git merge --no-edit upstream/brendon/fix-linting; then
            echo "✅ Merge successful"
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Merge conflict detected"
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            git merge --abort
            exit 1
          fi
      - name: Push merged changes
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          echo "Pushing changes to origin..."
          git push origin HEAD:${{ github.ref_name }}
      - name: Generate sync summary
        if: always()
        run: |
          echo "## 🔄 Upstream Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream:** https://github.com/okx/op-geth (brendon/fix-linting branch)" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.merge.outputs.merge_status }}" == "success" ]]; then
            echo "✅ **Successfully synced from upstream**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Recent Upstream Changes" >> $GITHUB_STEP_SUMMARY
            git log --oneline --graph --decorate -10 >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Merge conflict detected**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Please resolve conflicts manually:" >> $GITHUB_STEP_SUMMARY
            echo "1. Clone the repository" >> $GITHUB_STEP_SUMMARY
            echo "2. Run: \`git remote add upstream https://github.com/okx/op-geth.git\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Run: \`git fetch upstream\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Run: \`git merge upstream/brendon/fix-linting\`" >> $GITHUB_STEP_SUMMARY
            echo "5. Resolve conflicts and push" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Fail workflow if merge conflict
        if: steps.merge.outputs.merge_status != 'success'
        run: |
          echo "::error::Merge conflict detected. Please resolve manually."
          exit 1
  ##############################################################################
  # Phase 1: Build Dependencies
  ##############################################################################

  build-dependencies:
    needs: [sync-upstream]
    name: Build Geth and Tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build geth
        run: make geth

      - name: Build all tools
        run: make all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/bin/
          retention-days: 1

      - name: Generate build summary
        if: always()
        run: |
          echo "## 🔨 Build Dependencies" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All dependencies built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Built binaries:" >> $GITHUB_STEP_SUMMARY
            ls -lh build/bin/ >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
          fi
  ##############################################################################
  # Phase 2: Code Quality Checks
  ##############################################################################

  lint-go:
    needs: [sync-upstream]
    name: Go Linting (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        run: make lint

      - name: Run go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Generate lint summary
        if: always()
        run: |
          echo "## 🔍 Go Linting" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All checks passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Linting issues found**" >> $GITHUB_STEP_SUMMARY
          fi
  # format-check:
  #   needs: [sync-upstream]
  #   name: Code Format Check
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #       with:
  #         ref: ${{ github.ref }}

  #     - name: Set up Go
