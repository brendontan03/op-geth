  #         if ! git diff --exit-code; then
  #           echo "❌ Code formatting issues detected"
  #           echo "Please run 'make fmt' and commit the changes"
  #           exit 1
  #         fi
  #         echo "✅ Code formatting is correct"

  #     - name: Generate format check summary
  #       if: always()
  #       run: |
  #         echo "## 🎨 Code Format Check" >> $GITHUB_STEP_SUMMARY
  #         if [ $? -eq 0 ]; then
  #           echo "✅ **Code formatting is correct**" >> $GITHUB_STEP_SUMMARY
  #         else
  #           echo "❌ **Code formatting issues found**" >> $GITHUB_STEP_SUMMARY
  #         fi

  ##############################################################################
  # Phase 3: Unit Tests
  ##############################################################################

  unit-tests:
    needs: [build-dependencies]
    name: Unit Tests (Full)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/bin/

      - name: Run full unit tests (excluding E2E)
        run: |
          # Exclude test/e2e directory to skip E2E smoke tests
          # Use same build tags as 'make test': ckzg for KZG crypto support
          go test -tags=ckzg -timeout=45m $(go list ./... | grep -v '/test/e2e')
        timeout-minutes: 50

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Unit Tests (Full)" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All unit tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some unit tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
  unit-tests-short:
    needs: [build-dependencies]
    name: Unit Tests (Short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run short unit tests (excluding E2E)
        run: |
          # Exclude test/e2e directory and run with -short flag
          # Use same build tags as 'make test': ckzg for KZG crypto support
          go test -tags=ckzg -short -timeout=20m $(go list ./... | grep -v '/test/e2e')
      - name: Generate test summary
        if: always()
        run: |
          echo "## ⚡ Unit Tests (Short)" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All short tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some short tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
  xlayer-tests:
    needs: [build-dependencies]
    name: X Layer Specific Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run X Layer specific tests
        run: |
          # Test X Layer specific components
          # Use ckzg tag for KZG crypto support
          go test -tags=ckzg -v -timeout=20m ./eth -run ".*xlayer.*|.*Xlayer.*" || true
          go test -tags=ckzg -v -timeout=20m ./core -run ".*xlayer.*|.*Xlayer.*" || true
          go test -tags=ckzg -v -timeout=20m ./miner -run ".*okx.*|.*Okx.*" || true
          go test -tags=ckzg -v -timeout=20m ./xlayer/...
      - name: Generate test summary
        if: always()
        run: |
          echo "## 🔷 X Layer Specific Tests" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All X Layer tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some X Layer tests had issues (non-blocking)**" >> $GITHUB_STEP_SUMMARY
          fi
  ##############################################################################
  # Phase 4: Benchmark Tests (Optional)
  ##############################################################################

  benchmark-tests:
    needs: [build-dependencies]
    name: Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: false  # Enable when needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmark tests
        run: |
          go test -bench=. -benchmem -run=^$ $(go list ./... | grep -v '/test/e2e') | tee benchmark.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 7

      - name: Generate benchmark summary
        if: always()
        run: |
          echo "## 📊 Benchmark Tests" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **Benchmark tests completed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Benchmark tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
  ##############################################################################
  # Phase 5: Code Coverage (Optional)
  ##############################################################################

  code-coverage:
    needs: [build-dependencies]
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: false  # Enable when needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage (excluding E2E)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v '/test/e2e')
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## 📈 Code Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.out ]; then
            echo "✅ **Coverage report generated**" >> $GITHUB_STEP_SUMMARY
            go tool cover -func=coverage.out | tail -n 1 >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Coverage report generation failed**" >> $GITHUB_STEP_SUMMARY
          fi
  ##############################################################################
  # Phase 6: Report Status
  ##############################################################################

  report-status:
    name: Report Status to Lark/Feishu
    needs: [sync-upstream, build-dependencies, lint-go, unit-tests, unit-tests-short, xlayer-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Install jq for JSON formatting
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
      - name: Generate final summary
        if: always()
        run: |
          echo "## 📊 Final Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream Sync | ${{ needs.sync-upstream.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linting | ${{ needs.lint-go.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Full) | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Short) | ${{ needs.unit-tests-short.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| X Layer Tests | ${{ needs.xlayer-tests.result }} |" >> $GITHUB_STEP_SUMMARY
